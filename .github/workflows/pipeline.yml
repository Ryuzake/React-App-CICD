name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  packages: write

jobs:
  CI:
    runs-on: ec2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ryuzake
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ryuzake/react-app-cicd:${{ github.sha }}
            ghcr.io/ryuzake/react-app-cicd:latest

  CD:
    runs-on: ec2
    needs: CI
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ryuzake
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: |
          docker pull ghcr.io/ryuzake/react-app-cicd:${{ github.sha }}

      - name: Stop Old Container (if running)
        run: |
          docker stop react-app || true
          docker rm react-app || true

      - name: Run Docker Container
        run: |
          docker run -d \
            --name react-app \
            -p 80:80 \
            ghcr.io/ryuzake/react-app-cicd:${{ github.sha }}

      - name: Verify App is Running
        run: |
          sleep 5
          curl -f http://localhost:80 || exit 1
